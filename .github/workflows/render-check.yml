name: Compare isolated fish appearance in unchanged reef
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reef-render-check
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve the unchanged production files
        run: |
          mkdir -p render-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > render-evidence/server.log 2>&1 &
      - name: Probe safe WebGL2
        id: probe
        timeout-minutes: 2
        run: node tests/browser/verify-fish-surface.mjs probe
      - name: Capture six fixed-time fish appearance views
        if: steps.probe.outputs.available == 'true'
        timeout-minutes: 15
        run: |
          REEF_ARM=baseline REEF_SOURCE_DIR=dist REEF_TARGET=http://127.0.0.1:4173/dist/ node tests/browser/verify-fish-surface.mjs render
          REEF_ARM=candidate REEF_SOURCE_DIR=research/fish-surface/dist REEF_TARGET=http://127.0.0.1:4173/research/fish-surface/dist/ node tests/browser/verify-fish-surface.mjs render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-surface-${{ github.run_id }}
          path: render-evidence/
          retention-days: 7
      - if: steps.probe.outputs.available != 'true'
        run: exit 1
