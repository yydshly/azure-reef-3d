name: Inspect bounded fan-current shader and native timing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reef-render-check
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve the unchanged production files
        run: |
          mkdir -p render-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > render-evidence/server.log 2>&1 &
      - name: Probe safe WebGL2
        id: probe
        timeout-minutes: 2
        run: node tests/browser/verify-fan-current.mjs probe
      - name: Capture four controlled observation-height views
        if: steps.probe.outputs.available == 'true'
        timeout-minutes: 17
        run: |
          REEF_ARM=baseline REEF_SOURCE_DIR=research/fan-current/baseline/dist REEF_TARGET=http://127.0.0.1:4173/research/fan-current/baseline/dist/ node tests/browser/verify-fan-current.mjs render
          REEF_ARM=candidate REEF_SOURCE_DIR=research/fan-current/candidate/dist REEF_TARGET=http://127.0.0.1:4173/research/fan-current/candidate/dist/ node tests/browser/verify-fan-current.mjs render
          REEF_NATIVE=true RECORD_VIDEO=true REEF_ARM=native REEF_SOURCE_DIR=research/fan-current/candidate/dist REEF_TARGET=http://127.0.0.1:4173/research/fan-current/candidate/dist/ node tests/browser/verify-fan-current.mjs render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fan-current-${{ github.run_id }}
          path: render-evidence/
          retention-days: 7
      - if: steps.probe.outputs.available != 'true'
        run: exit 1
