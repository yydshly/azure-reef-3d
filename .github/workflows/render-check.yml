name: Compare fixed-time late-route composition candidate
on:
  workflow_dispatch:
    inputs:
      target_source:
        description: Public Pages or isolated checked-out branch preview
        type: choice
        options: [public-pages, branch-preview]
        default: public-pages
      view_set:
        description: Explicit fixed camera set
        type: choice
        options: [passage, legacy]
        default: passage
permissions:
  contents: read
concurrency:
  group: reef-render-check
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm ci --prefix tests/browser
      - name: Install official Chromium and OS dependencies
        run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated branch preview when requested
        if: inputs.target_source == 'branch-preview'
        run: |
          mkdir -p render-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > render-evidence/preview-server.log 2>&1 &
          echo $! > render-evidence/preview-server.pid
      - name: Probe real WebGL2 without security overrides
        id: probe
        timeout-minutes: 2
        run: node tests/browser/verify-route-rebalance.mjs probe
      - name: Preserve capability evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl2-capability-${{ github.run_id }}
          path: render-evidence/probe/probe.json
          retention-days: 7
      - name: Render actual public Pages and exercise fixed views
        if: steps.probe.outputs.available == 'true'
        timeout-minutes: 12
        env:
          REEF_TARGET: ${{ inputs.target_source == 'branch-preview' && 'http://127.0.0.1:4173/' || 'https://yydshly.github.io/azure-reef-3d/' }}
          REEF_VIEW_SET: ${{ inputs.view_set }}
        run: |
          REEF_ARM=baseline REEF_SOURCE_DIR=dist REEF_TARGET=http://127.0.0.1:4173/dist/ node tests/browser/verify-route-rebalance.mjs render
          REEF_ARM=candidate REEF_SOURCE_DIR=research/route-rebalance/dist REEF_TARGET=http://127.0.0.1:4173/research/route-rebalance/dist/ node tests/browser/verify-route-rebalance.mjs render
      - name: Preserve static comparison before route samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-static-${{ github.run_id }}
          path: render-evidence/
          retention-days: 7
      - name: Labelled late-route sampled recording
        timeout-minutes: 8
        run: REEF_ARM=route REEF_ROUTE=true RECORD_VIDEO=true REEF_SOURCE_DIR=research/route-rebalance/dist REEF_TARGET=http://127.0.0.1:4173/research/route-rebalance/dist/ node tests/browser/verify-route-rebalance.mjs render
      - name: Preserve screenshots, short video and runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-render-${{ github.run_id }}
          path: render-evidence/
          retention-days: 7
      - name: Mark unsupported renderer honestly
        if: steps.probe.outputs.available != 'true'
        run: echo 'WebGL2 probe unavailable or failed; inspect probe.json. No visual acceptance claimed.'; exit 1
