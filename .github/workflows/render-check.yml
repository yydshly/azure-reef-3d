name: Inspect bounded support03 shader and native timing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reef-render-check
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser
      - name: Download pinned official Chromium with bounded timeout
        timeout-minutes: 4
        run: timeout --kill-after=10s 180s tests/browser/node_modules/.bin/playwright install chromium
      - name: Check existing runner libraries before bounded dependency setup
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p render-evidence
          browser_binary=$(node -e "console.log(require('./tests/browser/node_modules/playwright').chromium.executablePath())")
          ldd "$browser_binary" > render-evidence/browser-libraries.txt
          if grep -q 'not found' render-evidence/browser-libraries.txt; then
            timeout --kill-after=10s 120s tests/browser/node_modules/.bin/playwright install-deps chromium
            ldd "$browser_binary" > render-evidence/browser-libraries-after.txt
            if grep -q 'not found' render-evidence/browser-libraries-after.txt; then exit 1; fi
          fi
      - name: Register licensed QA-only CJK subset
        run: |
          mkdir -p "$HOME/.local/share/fonts/reef-qa" render-evidence
          cp tests/browser/fonts/ReefQACJK-Regular.otf "$HOME/.local/share/fonts/reef-qa/"
          fc-cache -f "$HOME/.local/share/fonts/reef-qa"
          fc-match -f '%{family}\n%{file}\n' 'Reef QA CJK' > render-evidence/font-match.txt
          grep -q ReefQACJK-Regular.otf render-evidence/font-match.txt
      - name: Serve the unchanged production files
        run: |
          mkdir -p render-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > render-evidence/server.log 2>&1 &
      - name: Probe safe WebGL2
        id: probe
        timeout-minutes: 2
        run: node tests/browser/verify-support03.mjs probe
      - name: Capture four controlled observation-height views
        if: steps.probe.outputs.available == 'true'
        timeout-minutes: 17
        run: |
          REEF_ARM=baseline REEF_SOURCE_DIR=research/support03/baseline/dist REEF_TARGET=http://127.0.0.1:4173/research/support03/baseline/dist/ node tests/browser/verify-support03.mjs render
          REEF_ARM=candidate REEF_SOURCE_DIR=research/support03/candidate/dist REEF_TARGET=http://127.0.0.1:4173/research/support03/candidate/dist/ node tests/browser/verify-support03.mjs render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support03-${{ github.run_id }}
          path: render-evidence/
          retention-days: 7
      - if: steps.probe.outputs.available != 'true'
        run: exit 1
