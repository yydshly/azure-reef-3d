name: Publish unified showcase and preserve all existing worlds and versions
on:
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: Short-lived authorized download of the existing published artifact
        required: true
        type: string
      snapshot_digest:
        description: Existing artifact SHA256
        required: true
        type: string
      protected_hashes:
        description: Exact current public root and world entry hashes
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout only the showcase and its preservation checks
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dist/index.html
            /dist/legacy.html
            /dist/showcase/**
            /publish-showcase.py
            /qa-showcase.py
      - name: Restore pinned published bytes and replace only root HTML
        run: python3 publish-showcase.py
      - name: Set up the existing Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check complete version routes and unique screenshot previews
        run: |
          python3 qa-showcase.py .published-site
          node --check dist/showcase/app.js
      - name: Preserve publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: showcase-publication-receipt
          path: publication-receipt.json
          retention-days: 7
      - name: Configure existing Pages
        uses: actions/configure-pages@v5
      - name: Upload complete preserved site plus the unified showcase
        uses: actions/upload-pages-artifact@v4
        with:
          path: .published-site
      - name: Deploy existing Pages
        id: deployment
        uses: actions/deploy-pages@v4
