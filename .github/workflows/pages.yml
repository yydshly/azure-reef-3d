name: Deploy Azure Reef to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout verified independent exhibit archives
        uses: actions/checkout@v6
        with:
          ref: 721647f3ce146172aa7b796d84626f38663d0ec4
          path: .verified-preview-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /azure-reef-reefs4d-candidate-delta.zip
            /demand-fixed-baseline-full-delta.zip
            /current-gallery-baseline.zip
      - name: Add verified preview while preserving root-site bytes
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,shutil,subprocess,zipfile
          root=pathlib.Path('dist'); source=pathlib.Path('.verified-preview-source'); base='498cc09acda8b7d4609ee2dc863e01e6712c790c'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          subprocess.run(['git','diff','--exit-code',base,'--','dist'],check=True)
          before={str(p.relative_to(root)):sha(p.read_bytes()) for p in root.rglob('*') if p.is_file()}
          pathlib.Path('.root-site-hashes.json').write_text(json.dumps(before,sort_keys=True))
          assert before and not (root/'preview').exists(), 'Unexpected existing preview path'
          assert before['app.js']=='4127a29d4d9aed14a55d0f8a9a8ac8058fd8d6fc524683fa5dc48f8e8744a027'
          assert not any(p.is_symlink() for p in root.rglob('*'))
          preview=root/'preview'/'independent-scan'
          shutil.copytree(root, pathlib.Path('.preview-stage'))
          old=source/'azure-reef-reefs4d-candidate-delta.zip'; new=source/'demand-fixed-baseline-full-delta.zip'
          assert sha(old.read_bytes())=='6621e03fe42110a070eeb49be69403b29a6d5d0e9be6031865e1491764a83463'
          assert sha(new.read_bytes())=='0255a83b94874cb9295fdda91e6c234c47126196d2f86d279b1b05b6944158e2'
          stage=pathlib.Path('.preview-stage')
          capture_tools={'capture-current-scene.mjs','current-scene-gallery.mjs','qa-current-fallback.mjs','qa-hud.mjs','qa-c4-browser.mjs','qa-seagrass-hosted.mjs','compare-current-frames.py','comparison-baseline.json'}
          tool_dir=pathlib.Path('.preview-tools'); tool_dir.mkdir()
          with zipfile.ZipFile(old) as z:
              data=z.read('dist/assets/reefs4d/C12019-web.glb')
              assert sha(data)=='975228622829cb715ba9b48c0c5cc45c92e8b79d6689102cf188479318362502'
              p=stage/'assets/reefs4d/C12019-web.glb'; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          with zipfile.ZipFile(new) as z:
              names=z.namelist(); assert len(names)==len(set(names))==118
              manifest=json.loads(z.read('WORLD-MANIFEST.json')); assert manifest['base']==base
              files=manifest['files']; assert len(files)==117
              assert set(names)=={f['path'] for f in files}|{'WORLD-MANIFEST.json'}
              for f in files:
                  name=f['path']; rel=pathlib.PurePosixPath(name)
                  assert not rel.is_absolute() and '..' not in rel.parts and '\\' not in name
                  data=z.read(name); assert len(data)==f['bytes'] and sha(data)==f['sha256']
                  if name.startswith('dist/'):
                      p=stage/pathlib.PurePosixPath(name).relative_to('dist'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
                  elif name in capture_tools:
                      (tool_dir/name).write_bytes(data)
          assert {p.name for p in tool_dir.iterdir()}==capture_tools
          # The source checkout and candidate tools have already passed their existing guards.
          baseline_zip=source/'current-gallery-baseline.zip'
          assert sha(baseline_zip.read_bytes())=='0e50050db9f26a54163a0c6179fc652a33e1cce770399bc08ff4aaf1ca8e9df2'
          baseline_dir=pathlib.Path('.comparison-baseline')
          assert not baseline_dir.exists(), 'Unexpected pre-existing baseline directory'
          with zipfile.ZipFile(baseline_zip) as z:
              names=z.namelist(); assert len(names)==len(set(names))==7
              pins=json.loads(z.read('comparison-baseline.json'))
              assert z.read('comparison-baseline.json')==(tool_dir/'comparison-baseline.json').read_bytes()
              raw=z.read('manifest.original.json')
              assert len(raw)==123630 and sha(raw)==pins['manifestSha256']=='cc61d5f67184560e1158d15970a64d49ebc397d244313704d41bdfdd15f08b7e'
              original=json.loads(raw)
              assert original['checkoutCommit']==pins['baseMain']=='9ae6040cc3bc099576188c9d9ea1a9ed12d1f989'
              assert original['contentVersion']==pins['contentVersion']=='5b62d2ea3b9224921fedb553b8530787f5ec3ebacfa674f103a28ea17878b9a7'
              assert len(pins['frames'])==len(original['frames'])==5
              assert set(names)=={'manifest.original.json','comparison-baseline.json'}|{f['file'] for f in pins['frames']}
              for f,old_frame in zip(pins['frames'],original['frames']):
                  assert all(f[k]==old_frame[k] for k in ['id','file','sha256','bytes','width','height'])
                  data=z.read(f['file']); assert len(data)==f['bytes'] and sha(data)==f['sha256']
              for info in z.infolist():
                  rel=pathlib.PurePosixPath(info.filename)
                  assert len(rel.parts)==1 and not rel.is_absolute() and '..' not in rel.parts and '\\' not in info.filename
                  assert not info.is_dir() and (info.external_attr>>16)&0o170000!=0o120000
              baseline_dir.mkdir()
              for name in names:(baseline_dir/name).write_bytes(z.read(name))
          print('FIXED_BASELINE_VERIFIED',json.dumps({'files':7,'pngs':5,'manifest_sha256':sha(raw),'directory':str(baseline_dir),'network_required':False}))
          assert sha((stage/'app.js').read_bytes())=='1cb051a104a8cd4ed32101fccf187e63f72b1b68fbfda0d3993a838c70310a05', 'Unexpected preview app version'
          assert manifest.get('compatibilityRetain') == ['assets/models/68e02c88ba14a2c2']
          assert sha((stage/'model-version.js').read_bytes()) == '38a7f00b14980327891803364ec1bff9739b9a953f1b7d4a22cde330c302b163'
          assert all(sha((stage/name).read_bytes()) == digest for name,digest in before.items() if name.startswith('assets/models/68e02c88ba14a2c2/')), 'Cached-client model changed'
          preview.parent.mkdir(parents=True);shutil.move(str(stage),str(preview))
          after={str(p.relative_to(root)):sha(p.read_bytes()) for p in root.rglob('*') if p.is_file() and not p.is_relative_to(root/'preview')}
          assert after==before, 'Existing root-site bytes changed'
          for f in ['index.html','exhibit-entry.js','scan-exhibit.html','scan-exhibit.js','scan-exhibit.css','vendor/three.module.js','vendor/GLTFLoader.js','assets/reefs4d/C12019-web.glb']:
              assert (preview/f).is_file(), f
          assert './index.html?return=scan-exhibit' in (preview/'scan-exhibit.html').read_text()
          assert 'scan-exhibit.html' in (preview/'index.html').read_text()
          print('PREVIEW_PACKAGE_VERIFIED',json.dumps({'root_files_unchanged':len(before),'base':base,'preview':'preview/independent-scan/','app_sha256':before['app.js'],'exhibit_archive_sha256':sha(new.read_bytes()),'preview_files':sum(p.is_file() for p in preview.rglob('*'))}))
          PYCODE
      - name: Checkout isolated natural-rock candidate inputs
        uses: actions/checkout@v6
        with:
          ref: 3a8cc92719492e739b6a075b2a2e79e9d1597132
          path: .natural-rock-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /natural-rock-runtime-delta.zip
            /natural-rock-build-tools.zip
            /current-preview-gallery-757859b4.zip
      - name: Assemble candidate while preserving current preview
        run: |
          python3 - <<'PYTOOLS'
          import pathlib,hashlib,json,zipfile
          p=pathlib.Path('.natural-rock-inputs/natural-rock-build-tools.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2cad7fadc3eaa8fd623af1881d3257f272313edb5eab87912176891410c5d853'
          with zipfile.ZipFile(p) as z:
              names=z.namelist();assert len(names)==len(set(names))
              m=json.loads(z.read('TOOLS-MANIFEST.json'));assert set(names)==set(m)|{'TOOLS-MANIFEST.json'}
              for n,f in m.items():
                  assert pathlib.PurePosixPath(n).name==n and n not in ('.','..') and '\\' not in n
                  b=z.read(n);assert len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256']
                  pathlib.Path('.preview-tools',n).write_bytes(b)
          PYTOOLS
          python3 .preview-tools/assemble-candidate.py --dist dist --gallery .natural-rock-inputs/current-preview-gallery-757859b4.zip --receipt .preview-tools/current-gallery-receipt.json --output .protected-preview-hashes.json
          python3 .preview-tools/apply-rock-delta.py
      - name: Read pinned layered candidate inputs
        uses: actions/checkout@v6
        with:
          ref: 20a39f6811862b14340fea3246e2211b4c68f0ef
          path: .layered-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /layered-ridges-runtime-delta.zip
            /layered-build-tools.zip
            /natural-rock-gallery-a50db35.zip
      - name: Assemble third candidate and preserve both existing previews
        run: |
          python3 - <<'PYTOOLS'
          import pathlib,hashlib,json,zipfile
          p=pathlib.Path('.layered-inputs/layered-build-tools.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3c3f16b6cc156cf57f33caceeddc2fb440988756d9cf8efaf4863ec93bb1c477'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('TOOLS-MANIFEST.json'))
              assert len(z.namelist())==len(set(z.namelist()))==len(m)+1
              assert set(z.namelist())==set(m)|{'TOOLS-MANIFEST.json'}
              for n,f in m.items():
                  assert pathlib.PurePosixPath(n).name==n and n not in ('.','..') and '\\' not in n
                  b=z.read(n);assert len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256']
                  pathlib.Path('.preview-tools',n).write_bytes(b)
          PYTOOLS
          python3 .preview-tools/stage-layered.py
      - name: Read pinned coral midground candidate inputs
        uses: actions/checkout@v6
        with:
          ref: 2d6f29a1f4722342bae281e24a02bff8f351d152
          path: .coral-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /coral-midground-runtime-delta.zip
            /coral-build-tools.zip
            /layered-gallery-beddb9e6.zip
      - name: Assemble fourth candidate and preserve all existing previews
        run: |
          python3 - <<'PYTOOLS'
          import pathlib,hashlib,json,zipfile
          p=pathlib.Path('.coral-inputs/coral-build-tools.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='a1826e3aaa2eacd26a9746289613fc8f5a44e4873417ed0529f04f9454c90a31'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('TOOLS-MANIFEST.json'))
              assert len(z.namelist())==len(set(z.namelist()))==len(m)+1
              assert set(z.namelist())==set(m)|{'TOOLS-MANIFEST.json'}
              for n,f in m.items():
                  assert pathlib.PurePosixPath(n).name==n and n not in ('.','..') and '\\' not in n
                  b=z.read(n);assert len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256']
                  pathlib.Path('.preview-tools',n).write_bytes(b)
          PYTOOLS
          python3 .preview-tools/stage-coral.py
      - name: Read pinned animal scale inputs
        uses: actions/checkout@v6
        with:
          ref: b4cea8175f6b4dabad465920085641535c0c18cf
          path: .animal-inputs
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /animal-scale-cache-delta.zip
            /animal-build-tools.zip
            /coral-gallery-20262d13.zip
      - name: Apply bounded animal scale update to existing coral preview
        run: |
          python3 - <<'PYTOOLS'
          import pathlib,hashlib,json,zipfile
          p=pathlib.Path('.animal-inputs/animal-build-tools.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ce12af355f6c9eeaefd087121f71ac1f5feee7f2b0ef544a4c90b80b816551f6'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('TOOLS-MANIFEST.json'))
              assert len(z.namelist())==len(set(z.namelist()))==len(m)+1
              assert set(z.namelist())==set(m)|{'TOOLS-MANIFEST.json'}
              for n,f in m.items():
                  assert pathlib.PurePosixPath(n).name==n and n not in ('.','..') and '\\' not in n
                  b=z.read(n);assert len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256']
                  pathlib.Path('.preview-tools',n).write_bytes(b)
          PYTOOLS
          python3 .preview-tools/stage-animal-scale.py
      - name: Set up existing pinned capture dependency
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned Playwright and official Chromium
        timeout-minutes: 4
        run: |
          python3 -m pip install --index-url https://pypi.org/simple Pillow==11.3.0
          npm ci --prefix tests/browser
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Probe sandboxed WebGL2 before current captures
        timeout-minutes: 2
        run: |
          node tests/browser/verify-pages.mjs probe
          node -e "const p=require('./render-evidence/probe.json'); if(!p.webgl2.available) process.exit(1)"
      - name: Generate five version-bound current scene stills
        timeout-minutes: 8
        env:
          REEF_PREVIEW_DIR: dist/preview/coral-midground-candidate
          REEF_CAPTURE_PATH: /preview/coral-midground-candidate/
          REEF_CANDIDATE_SOURCE_COMMIT: b4cea8175f6b4dabad465920085641535c0c18cf
          REEF_CANDIDATE_ARCHIVE_SHA256: 4dd98793127062e5b5072c66ba0d01f895296f8991dd44fe9ae3385639953f94
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/reef-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/preview/coral-midground-candidate/index.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/preview/coral-midground-candidate/index.html > /dev/null
          node .preview-tools/capture-current-scene.mjs
      - name: Verify generated gallery and narrow failure-page flows
        timeout-minutes: 3
        env:
          REEF_QA_ROOT: dist/preview/coral-midground-candidate
          REEF_QA_REQUIRE_CAPTURE: '1'
        run: |
          export PLAYWRIGHT_MODULE="file://$GITHUB_WORKSPACE/tests/browser/node_modules/playwright/index.mjs"
          python3 .preview-tools/compare-current-frames.py
          python3 - <<'PYCOMPARE'
          import json
          report=json.load(open('render-evidence/png-comparison.json'))
          assert report['completed'] and len(report['frames'])==5
          for frame in report['frames']:
              assert frame['unaffectedSceneRegion']['differentPixels']==0, 'Scene pixels changed: '+frame['id']
              hud=frame['hudBoundsRegion']
              assert hud['differentPixels']<=64, 'HUD pixel change exceeded bounded raster scope: '+frame['id']
              assert max(hud['maximumChannelDifferenceRGBA'][:3])<=12, 'HUD RGB difference exceeded scope: '+frame['id']
              assert hud['maximumChannelDifferenceRGBA'][3]==0, 'HUD alpha changed: '+frame['id']
          print('ANIMAL_SCALE_PIXEL_SCOPE_VERIFIED',5,'CHANGED_REGION_VISUAL_REVIEW_PENDING')
          PYCOMPARE
          node .preview-tools/qa-current-fallback.mjs
      - name: Recheck all formal root bytes after capture
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          root=pathlib.Path('dist')
          before=json.loads(pathlib.Path('.root-site-hashes.json').read_text())
          after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and not p.is_relative_to(root/'preview')}
          assert before==after and len(after)==79, 'Formal site changed during capture'
          print('POST_CAPTURE_ROOT_VERIFIED',len(after))
          PYCODE
      - name: Verify original preview remains byte-identical
        run: python3 .preview-tools/verify-protected.py --dist dist --snapshot .protected-preview-hashes.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
